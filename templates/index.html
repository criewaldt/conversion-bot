<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversion Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #app {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      width: 640px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      height: 85vh;
    }

    #header {
      padding: 14px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #header h1 { font-size: 15px; font-weight: 600; color: #111; }
    #header-meta { font-size: 12px; color: #888; }

    #new-btn {
      font-size: 13px; color: #999;
      background: none; border: none; cursor: pointer;
    }
    #new-btn:hover { color: #555; }

    /* Setup screen */
    #setup-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px;
      gap: 20px;
    }

    #setup-screen h2 { font-size: 18px; font-weight: 600; color: #111; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; font-weight: 500; color: #444; }

    #goal-input {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    #goal-input:focus { border-color: #0071e3; }

    #system-prompt-input {
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }
    #system-prompt-input:focus { border-color: #0071e3; }

    #start-btn {
      padding: 11px 28px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
    }
    #start-btn:hover { background: #005bb5; }

    /* Chat screen */
    #chat-screen { flex: 1; display: none; flex-direction: column; overflow: hidden; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #0071e3;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.agent {
      align-self: flex-start;
      background: #f0f0f0;
      color: #111;
      border-bottom-left-radius: 4px;
    }

    #input-area {
      padding: 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }
    #input:focus { border-color: #0071e3; }

    #send-btn {
      padding: 10px 20px;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 14px;
      cursor: pointer;
    }
    #send-btn:disabled { background: #ccc; cursor: default; }
    #send-btn:hover:not(:disabled) { background: #005bb5; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div>
        <h1>Conversion Bot</h1>
        <div id="header-meta"></div>
      </div>
      <button id="new-btn">New conversation</button>
    </div>

    <div id="setup-screen">
      <h2>Start a conversation</h2>

      <div class="field">
        <label for="goal-input">Goal</label>
        <input id="goal-input" type="text" placeholder="e.g. make the sale, book a call, convert inquiry">
      </div>

      <div class="field">
        <label for="system-prompt-input">System prompt</label>
        <textarea id="system-prompt-input" placeholder="Describe how the bot should behave, what it's selling, tone, constraints, etc."></textarea>
      </div>

      <button id="start-btn">Start</button>
    </div>

    <div id="chat-screen">
      <div id="messages"></div>
      <div id="input-area">
        <input id="input" type="text" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const setupScreen = document.getElementById("setup-screen");
    const chatScreen = document.getElementById("chat-screen");
    const goalInput = document.getElementById("goal-input");
    const systemPromptInput = document.getElementById("system-prompt-input");
    const startBtn = document.getElementById("start-btn");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const newBtn = document.getElementById("new-btn");
    const headerMeta = document.getElementById("header-meta");

    let sessionId = null;

    function showChat(goal) {
      headerMeta.textContent = `Goal: ${goal}`;
      setupScreen.style.display = "none";
      chatScreen.style.display = "flex";
      inputEl.focus();
    }

    function showSetup() {
      sessionId = null;
      headerMeta.textContent = "";
      messagesEl.innerHTML = "";
      goalInput.value = "";
      systemPromptInput.value = "";
      setupScreen.style.display = "flex";
      chatScreen.style.display = "none";
    }

    function addMessage(text, role) {
      const el = document.createElement("div");
      el.className = `message ${role}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    startBtn.addEventListener("click", async () => {
      const goal = goalInput.value.trim();
      const systemPrompt = systemPromptInput.value.trim();
      if (!goal || !systemPrompt) return;

      const res = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal, system_prompt: systemPrompt }),
      });
      const data = await res.json();
      sessionId = data.session_id;
      showChat(goal);
    });

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !sessionId) return;

      inputEl.value = "";
      sendBtn.disabled = true;
      addMessage(text, "user");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        const data = await res.json();
        addMessage(data.response ?? data.detail, "agent");
      } catch {
        addMessage("Error reaching the server.", "agent");
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
    newBtn.addEventListener("click", showSetup);
  </script>
</body>
</html>
